apiVersion: apps/v1
kind: Deployment

metadata:
  name: online-exam-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: online-exam

  template:
    metadata:
      labels:
        app: online-exam

    spec:
      containers:
        - name: online-exam
          image: online-exam:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8081
